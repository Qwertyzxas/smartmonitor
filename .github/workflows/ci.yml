name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  e2e-docker:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up --build
        run: docker compose up -d --build
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/api/health && break
            sleep 3
          done
          docker compose ps
      - name: Acceptance scenario (add service → check → outage → incident → AI action)
        run: python3 scripts/e2e_check.py http://localhost:8080
      - name: Hourly self-test suite passes inside the worker
        run: python3 scripts/e2e_check.py http://localhost:8080 --qa
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Shutdown
        if: always()
        run: docker compose down -v
